basePath: /
definitions:
  auth.EmailRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/repositories.UserInformation'
    type: object
  auth.RefreshRequest:
    properties:
      refreshToken:
        minLength: 1
        type: string
    required:
    - refreshToken
    type: object
  auth.RefreshResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.ResetPasswordRequest:
    properties:
      newPassword:
        minLength: 8
        type: string
      token:
        minLength: 1
        type: string
    required:
    - newPassword
    - token
    type: object
  auth.TokenRequest:
    properties:
      token:
        minLength: 1
        type: string
    required:
    - token
    type: object
  errors.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  health.HealthResponse:
    properties:
      services:
        $ref: '#/definitions/health.HealthServices'
      status:
        type: string
      timestamp:
        type: string
    type: object
  health.HealthServices:
    properties:
      database:
        type: string
      redis:
        type: string
    type: object
  health.HomeResponse:
    properties:
      appEnv:
        type: string
      appName:
        type: string
      date:
        type: string
    type: object
  health.LiveResponse:
    properties:
      alive:
        type: boolean
    type: object
  permissions.CreatePermissionRequest:
    properties:
      group:
        maxLength: 100
        minLength: 1
        type: string
      name:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - group
    - name
    type: object
  permissions.PermissionList:
    properties:
      createdAt:
        type: string
      group:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  permissions.UpdatePermissionRequest:
    properties:
      group:
        maxLength: 100
        minLength: 1
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - group
    - name
    type: object
  profile.UpdatePasswordRequest:
    properties:
      currentPassword:
        minLength: 1
        type: string
      newPassword:
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  profile.UpdateProfileRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - email
    - name
    type: object
  repositories.UserInformation:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
    type: object
  roles.PermissionAssignment:
    properties:
      id:
        type: string
      isAssigned:
        type: boolean
      name:
        type: string
    type: object
  roles.PermissionGroup:
    properties:
      group:
        type: string
      names:
        items:
          $ref: '#/definitions/roles.PermissionAssignment'
        type: array
    type: object
  roles.RoleDetail:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/roles.PermissionGroup'
        type: array
      updatedAt:
        type: string
    type: object
  roles.RoleList:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  roles.RoleRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      permissionIds:
        items:
          type: string
        type: array
    required:
    - name
    - permissionIds
    type: object
  selectoptions.PermissionGroupOption:
    properties:
      group:
        type: string
      permissions:
        items:
          $ref: '#/definitions/selectoptions.PermissionOption'
        type: array
    type: object
  selectoptions.PermissionOption:
    properties:
      group:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  selectoptions.RoleOption:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  users.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
      remark:
        maxLength: 255
        type: string
      roleIds:
        items:
          type: string
        type: array
      status:
        enum:
        - active
        - inactive
        - suspended
        - blocked
        type: string
    required:
    - email
    - name
    - password
    - roleIds
    - status
    type: object
  users.ResetPasswordRequest:
    properties:
      newPassword:
        minLength: 8
        type: string
    required:
    - newPassword
    type: object
  users.RoleOption:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  users.UpdateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      remark:
        maxLength: 255
        type: string
      roleIds:
        items:
          type: string
        type: array
      status:
        enum:
        - active
        - inactive
        - suspended
        - blocked
        type: string
    required:
    - email
    - name
    - roleIds
    - status
    type: object
  users.UserDetail:
    properties:
      createdAt:
        type: string
      email:
        type: string
      emailVerifiedAt:
        type: string
      id:
        type: string
      name:
        type: string
      remark:
        type: string
      roles:
        items:
          $ref: '#/definitions/users.RoleOption'
        type: array
      status:
        type: string
      updatedAt:
        type: string
    type: object
  users.UserList:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      remark:
        type: string
      roles:
        items:
          type: string
        type: array
      status:
        type: string
      updatedAt:
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/errors.FieldError'
        type: array
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  utils.PaginatedData-permissions_PermissionList:
    properties:
      data:
        items:
          $ref: '#/definitions/permissions.PermissionList'
        type: array
      meta:
        $ref: '#/definitions/utils.PaginationMeta'
    type: object
  utils.PaginatedData-roles_RoleList:
    properties:
      data:
        items:
          $ref: '#/definitions/roles.RoleList'
        type: array
      meta:
        $ref: '#/definitions/utils.PaginationMeta'
    type: object
  utils.PaginatedData-users_UserList:
    properties:
      data:
        items:
          $ref: '#/definitions/users.UserList'
        type: array
      meta:
        $ref: '#/definitions/utils.PaginationMeta'
    type: object
  utils.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      totalCount:
        type: integer
    type: object
  utils.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
host: localhost:3000
info:
  contact: {}
  description: Production-ready Go REST API boilerplate
  title: Clean Go Fiber API
  version: "1.0"
paths:
  /:
    get:
      description: Application name, environment, and server time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/health.HomeResponse'
              type: object
      summary: Root
      tags:
      - General
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always answers 200, whether or not the email is registered.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.EmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Request a password reset email
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Login
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.RefreshResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Exchange a refresh token for a new token pair
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Register a new account
      tags:
      - Authentication
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Always answers 200, whether or not the email is registered or already
        verified.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.EmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Resend the verification email
      tags:
      - Authentication
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Reset a password with a reset token
      tags:
      - Authentication
  /auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verification token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Verify an email address
      tags:
      - Authentication
  /health:
    get:
      description: Probes PostgreSQL and Redis; 503 when either fails.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/health.HealthResponse'
              type: object
        "503":
          description: Service Unavailable
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/health.HealthResponse'
              type: object
      summary: Health check
      tags:
      - General
  /live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/health.LiveResponse'
              type: object
      summary: Liveness probe
      tags:
      - General
  /profile:
    get:
      description: Returns the caller's identity, roles, and permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/repositories.UserInformation'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get own profile
      tags:
      - Profile
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/profile.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/repositories.UserInformation'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update own profile
      tags:
      - Profile
  /profile/password:
    patch:
      consumes:
      - application/json
      description: Checks the current password, then stores the new one and clears
        the cached user information.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/profile.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - Profile
  /settings/permissions:
    get:
      description: 'Requires ''permission list'' permission. Filters: filter[name],
        filter[group], filter[createdAt], filter[updatedAt] (YYYY-MM-DD or start,end).'
      parameters:
      - description: Page (>= 1)
        in: query
        name: page
        type: integer
      - description: Page size (1-100)
        in: query
        name: perPage
        type: integer
      - description: Search name, group
        in: query
        name: search
        type: string
      - description: id, name, group, createdAt, updatedAt
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: sortDirection
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/utils.PaginatedData-permissions_PermissionList'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - Settings/Permissions
    post:
      consumes:
      - application/json
      description: Creates one permission per entry in name, stored as "<group> <name>".
        Requires 'permission create' permission.
      parameters:
      - description: Group and actions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/permissions.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create permissions
      tags:
      - Settings/Permissions
  /settings/permissions/{id}:
    delete:
      description: Hard delete; role grants cascade. Requires 'permission delete'
        permission.
      parameters:
      - description: Permission ID (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete permission
      tags:
      - Settings/Permissions
    get:
      description: Requires 'permission detail' permission.
      parameters:
      - description: Permission ID (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/permissions.PermissionList'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Permission detail
      tags:
      - Settings/Permissions
    patch:
      consumes:
      - application/json
      description: name is stored verbatim, so send the full "<group> <action>" string.
        Requires 'permission edit' permission.
      parameters:
      - description: Permission ID (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: Permission
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/permissions.UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update permission
      tags:
      - Settings/Permissions
  /settings/roles:
    get:
      description: 'Requires ''role list'' permission. Filters: filter[name], filter[createdAt],
        filter[updatedAt] (YYYY-MM-DD or start,end).'
      parameters:
      - description: Page (>= 1)
        in: query
        name: page
        type: integer
      - description: Page size (1-100)
        in: query
        name: perPage
        type: integer
      - description: Search name
        in: query
        name: search
        type: string
      - description: id, name, createdAt, updatedAt
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: sortDirection
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/utils.PaginatedData-roles_RoleList'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - Settings/Roles
    post:
      consumes:
      - application/json
