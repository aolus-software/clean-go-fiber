basePath: /
definitions:
  auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - name
    - password
    type: object
  auth.ResetPasswordRequest:
    properties:
      confirm_password:
        type: string
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - confirm_password
    - password
    - token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  permissions.PermissionRequest:
    properties:
      modules:
        maxLength: 255
        minLength: 2
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - modules
    - name
    type: object
  permissions.PermissionResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      modules:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  profile.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - password
    type: object
  profile.ProfileResponse:
    properties:
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      name:
        type: string
      roles:
        items:
          $ref: '#/definitions/profile.RoleItem'
        type: array
      status:
        type: string
    type: object
  profile.RoleItem:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  profile.UpdateProfileRequest:
    properties:
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - name
    type: object
  roles.PermissionItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      modules:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  roles.RoleRequest:
    properties:
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - name
    type: object
  roles.RoleResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/roles.PermissionItem'
        type: array
      updated_at:
        type: string
    type: object
  roles.SyncPermissionsRequest:
    properties:
      permission_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  users.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - email
    - name
    - password
    - status
    type: object
  users.RoleItem:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  users.SyncRolesRequest:
    properties:
      role_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - role_ids
    type: object
  users.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - email
    - name
    - status
    type: object
  users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      name:
        type: string
      roles:
        items:
          $ref: '#/definitions/users.RoleItem'
        type: array
      status:
        type: string
      updated_at:
        type: string
    type: object
  utils.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
      success:
        type: boolean
    type: object
